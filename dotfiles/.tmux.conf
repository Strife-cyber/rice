# ── Core ─────────────────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-kitty:RGB,xterm-256color:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on          # kitty image protocol (yazi previews) inside tmux
set -g status-position top
setw -g mode-keys vi

# ── Keys ─────────────────────────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -r C-h previous-window
bind -r C-l next-window
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit
bind y display-popup -E -w 90% -h 90% -d "#{pane_current_path}" yazi
bind t display-popup -E -w 80% -h 75% -d "#{pane_current_path}"
bind s display-popup -E -w 60% -h 50% "tmux ls -F '#S' | fzf --prompt='session ❯ ' | xargs -r tmux switch-client -t"
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi C-v send -X rectangle-toggle

# ── Catppuccin theme ─────────────────────────────────────────────────────────
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_date_time_text " %H:%M"
run ~/.tmux/plugins/catppuccin-tmux/catppuccin.tmux
set -g status-left-length 100
set -g status-right-length 100
set -g status-left "#{E:@catppuccin_status_session} "
set -g status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_host}"
set -ag status-right "#{E:@catppuccin_status_date_time}"

# ── Plugins ──────────────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'   # prefix C-s save, C-r restore
set -g @plugin 'tmux-plugins/tmux-continuum'   # auto-save every 15 min, auto-restore
set -g @plugin 'christoomey/vim-tmux-navigator' # Ctrl+h/j/k/l across tmux & nvim
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'
run ~/.tmux/plugins/tpm/tpm
