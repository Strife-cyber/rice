# ── Theme ────────────────────────────────────────────────────────────────────
include current-theme.conf

# ── Font ─────────────────────────────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0
disable_ligatures cursor

# ── Window ───────────────────────────────────────────────────────────────────
background_opacity 0.85
dynamic_background_opacity yes
window_padding_width 10 14
hide_window_decorations no
remember_window_size yes
initial_window_width  120c
initial_window_height 34c
confirm_os_window_close 0
enabled_layouts splits,stack,tall
inactive_text_alpha 0.75
active_border_color #cba6f7

# ── Cursor ───────────────────────────────────────────────────────────────────
cursor_shape beam
cursor_blink_interval 0.6
cursor_trail 3
cursor_trail_decay 0.1 0.4

# ── Tab bar ──────────────────────────────────────────────────────────────────
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_min_tabs 2
tab_title_template "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{index}: {title}"

# ── Behaviour ────────────────────────────────────────────────────────────────
scrollback_lines 20000
scrollback_pager_history_size 50
copy_on_select clipboard
strip_trailing_spaces smart
enable_audio_bell no
visual_bell_duration 0.0
url_style curly
detect_urls yes
shell_integration enabled
allow_remote_control socket-only
listen_on unix:@kitty
notify_on_cmd_finish unfocused 30.0

# ── Keys (kitty_mod = ctrl+shift) ────────────────────────────────────────────
map kitty_mod+enter launch --location=hsplit --cwd=current
map kitty_mod+\     launch --location=vsplit --cwd=current
map kitty_mod+t     new_tab_with_cwd
map kitty_mod+z     toggle_layout stack
map kitty_mod+h     neighboring_window left
map kitty_mod+l     neighboring_window right
map kitty_mod+k     neighboring_window up
map kitty_mod+j     neighboring_window down
map kitty_mod+r     start_resizing_window
map kitty_mod+1     goto_tab 1
map kitty_mod+2     goto_tab 2
map kitty_mod+3     goto_tab 3
map kitty_mod+4     goto_tab 4
map kitty_mod+5     goto_tab 5
map kitty_mod+equal change_font_size all +1.0
map kitty_mod+minus change_font_size all -1.0
map kitty_mod+0     change_font_size all 0
map kitty_mod+a>m   set_background_opacity +0.05
map kitty_mod+a>l   set_background_opacity -0.05
map kitty_mod+g     show_last_command_output
map kitty_mod+u     kitten unicode_input
map kitty_mod+e     open_url_with_hints
map kitty_mod+f5    load_config_file
